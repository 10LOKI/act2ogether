<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect fill="url(#bg)" width="400" height="300"/>
  
  <!-- Table -->
  <rect x="50" y="180" width="300" height="10" fill="#8B4513"/>
  <rect x="60" y="190" width="10" height="60" fill="#8B4513"/>
  <rect x="330" y="190" width="10" height="60" fill="#8B4513"/>
  
  <!-- Food boxes -->
  <rect x="100" y="140" width="50" height="40" fill="#FF6B6B" rx="3"/>
  <rect x="170" y="140" width="50" height="40" fill="#4ECDC4" rx="3"/>
  <rect x="240" y="140" width="50" height="40" fill="#FFE66D" rx="3"/>
  
  <!-- People -->
  <circle cx="80" cy="120" r="12" fill="#2ECC71"/>
  <rect x="74" y="132" width="12" height="25" fill="#2ECC71"/>
  
  <circle cx="320" cy="120" r="12" fill="#3498DB"/>
  <rect x="314" y="132" width="12" height="25" fill="#3498DB"/>
  
  <!-- Heart symbol -->
  <text x="200" y="80" font-size="50" text-anchor="middle">❤️</text>
  
  <!-- Text -->
  <text x="200" y="280" font-family="Arial" font-size="20" fill="#2E7D32" text-anchor="middle" font-weight="bold">Distribution Alimentaire</text>
</svg>